              - { name: previous, label: Previous, widget: string }
              - { name: next, label: Next, widget: string }

  # ------------------------------------------------------------- settings ---
  - name: settings
    editor: { preview: false }
    label: Building info
    files:
      - name: site
        label: 'Name, address & contact'
        file: src/data/site.json
        fields:
          - { name: name, label: 'Building name', widget: string }
          - { name: tagline, label: 'Headline on the home page', widget: string }
          - { name: description, label: 'Short description', widget: text }
          - name: logo
            label: Logo
            widget: object
            collapsed: true
            hint: 'SVG or PNG. The dark version is used on light backgrounds (header), the light version on dark ones (footer). Clear both to show the name as text instead.'
            fields:
              - { name: dark, label: 'Dark logo file', widget: file, required: false, media_folder: /public, public_folder: / }
              - { name: light, label: 'Light logo file', widget: file, required: false, media_folder: /public, public_folder: / }
              - { name: compact, label: 'Compact version for the header (optional)', widget: file, required: false, media_folder: /public, public_folder: /, hint: 'A tighter crop that stays readable in a slim header. Falls back to the dark logo.' }
              - { name: heightPx, label: 'Header logo height (pixels)', widget: number, value_type: int, min: 24, max: 120, default: 44, hint: 'The footer logo is about 3× this.' }
          - name: unitTerm
            label: 'What do you call a unit?'
            widget: object
            hint: 'Used in sentences like "15 of 24 ___ are available". e.g. residence / residences, condo / condos, home / homes'
            fields:
              - { name: singular, label: 'One of them', widget: string }
              - { name: plural, label: 'Several of them', widget: string }
          - name: formspreeId
            label: 'Contact form ID'
            widget: string
            hint: 'The code from your Formspree account that makes the contact form work'
          - { name: phone, label: 'Phone (as displayed)', widget: string }
          - { name: phoneHref, label: 'Phone (for tap-to-call)', widget: string, hint: 'Digits only, e.g. +15550102400' }
          - { name: email, label: Email, widget: string }
          - name: address
            label: Address
            widget: object
            fields:
              - { name: street, label: Street, widget: string }
              - { name: city, label: City, widget: string }
              - { name: state, label: State, widget: string }
              - { name: zip, label: 'ZIP code', widget: string }
              - { name: country, label: Country, widget: string }
          - name: geo
            label: 'Map pin'
            widget: object
            fields:
              - { name: lat, label: Latitude, widget: number, value_type: float }
              - { name: lng, label: Longitude, widget: number, value_type: float }
          - name: salesGallery
            label: 'Sales gallery hours'
            widget: object
            fields:
              - name: hours
                label: Hours
                widget: list
                summary: '{{fields.days}} — {{fields.time}}'
                fields:
                  - { name: days, label: Days, widget: string }
                  - { name: time, label: Hours, widget: string }
          - name: brokerage
            label: Brokerage
            widget: object
            fields:
              - { name: name, label: 'Brokerage name', widget: string }
              - { name: license, label: 'Brokerage license', widget: string }
              - { name: agent, label: 'Agent name', widget: string }
              - { name: agentLicense, label: 'Agent license', widget: string }
          - name: social
            label: 'Social links'
            widget: list
            summary: '{{fields.label}}'
            fields:
              - { name: label, label: Name, widget: string }
              - { name: href, label: Link, widget: string }
          - name: stats
            label: 'Numbers strip on the home page'
            widget: list
            summary: '{{fields.value}} {{fields.label}}'
            fields:
              - { name: value, label: Number, widget: string }
              - { name: label, label: Label, widget: string }
