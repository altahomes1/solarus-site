            fields:
              - { name: beds, label: Beds, widget: string }
              - { name: baths, label: Baths, widget: string }
              - { name: size, label: Size, widget: string }
              - { name: floor, label: Floor, widget: string }
              - { name: exposure, label: Exposure, widget: string }
              - { name: available, label: '"Available" row label', widget: string }
              - { name: status, label: '"Status" row label (sold units)', widget: string }
              - { name: closed, label: 'Sold units: status value', widget: string }
              - { name: noLongerAvailable, label: 'Sold units: button text', widget: string }
              - { name: enquire, label: 'Enquire button (unit number is added)', widget: string }
              - { name: forSale, label: 'Corner badge: sale', widget: string }
              - { name: forLease, label: 'Corner badge: lease', widget: string }
              - { name: statusAvailable, label: 'Badge: available', widget: string }
              - { name: statusPending, label: 'Badge: pending', widget: string }
              - { name: statusSold, label: 'Badge: sold', widget: string }
              - { name: studio, label: 'Word for 0 bedrooms', widget: string }
